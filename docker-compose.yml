# Free, local-only services for the optional streaming + lineage features.
#   docker compose up -d kafka      # trace streaming (ACP_TRACE_MODE=kafka)
#   docker compose up -d neo4j      # lineage graph; browser at http://localhost:7474
# The Neo4j password below is a throwaway for local development only; never reuse it anywhere real.
services:
  kafka:
    # Single-node KRaft broker (no ZooKeeper). Uses host port 19092 so it never clashes with a Kafka you
    # may already run on the default 9092.
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "19092:19092"
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/acp-local-dev
    ports:
      - "7474:7474"
      - "7687:7687"
