<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Agent Control Plane</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="styles.css">
<style>
  .login { max-width: 380px; margin: 12vh auto 0; padding: 0 16px; }
  .login form { display: grid; gap: 12px; margin-top: 14px; }
  .login label { font-size: 13px; color: var(--muted); }
  .login input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font: inherit; }
  .login input:focus-visible, .login button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .login .go { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; padding: 10px 14px; }
  .login .go[disabled] { opacity: .6; cursor: progress; }
  #err { color: var(--bad); font-size: 13px; min-height: 1.4em; margin: 0; }
</style>
</head>
<body>
<main class="login" id="main">
  <div class="card">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M7 20l5-6 4 4 8-10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><h1>Agent Control Plane</h1><p>Portfolio project · synthetic data</p></div>
    </div>
    <form id="f" autocomplete="on">
      <div>
        <label for="pw">Password</label>
        <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
      </div>
      <p id="err" role="alert" aria-live="assertive"></p>
      <button class="btn go" id="go" type="submit">Sign in</button>
    </form>
    <p class="muted small" style="margin-top:14px">Ask the project owner for the password. It gates the dashboard data, which comes from saved runs.</p>
  </div>
</main>
<script>
"use strict";
const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.textContent = ""; go.disabled = true;
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("pw").value }), credentials: "same-origin" });
    if (r.ok) { location.replace("./"); return; }
    const j = await r.json().catch(() => ({}));
    err.textContent = j.error || "Sign-in failed (HTTP " + r.status + ").";
  } catch (_) {
    err.textContent = "Could not reach the sign-in service. (Running locally? The login only exists once deployed.)";
  }
  go.disabled = false;
});
</script>
</body>
</html>
