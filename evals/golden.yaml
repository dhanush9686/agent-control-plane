- {id: trap-05, category: contradiction_trap, question: "Does The Dark Knight share a continuity with Batman Begins?", expect: answer, must_include: [["yes", "share", "same continuity", "one continuity"]]}
- {id: trap-06, category: contradiction_trap, question: "Is Oppenheimer a sequel to Dunkirk?", expect: answer, must_include: [["no", "not", "standalone"]]}
