- {id: trap-09, category: contradiction_trap, question: "Is Dragon part of the same continuity as Inception?", expect: answer, must_include: [["no", "not"]]}

- {id: unans-04, category: unanswerable, question: "Who was the cinematographer of Interstellar?", expect: refuse}
- {id: unans-05, category: unanswerable, question: "What was the budget of Inception?", expect: refuse}
