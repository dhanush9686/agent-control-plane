name: scheduled-eval
# Runs the full golden-set eval weekly and records the result in results/history.jsonl (drives the Trends tab).
# Free: uses Groq's free tier + GitHub Actions minutes. One-time setup: add a repository secret named GROQ_API_KEY
# (Settings > Secrets and variables > Actions). Without it, the job exits cleanly and says why.
on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: scheduled-eval
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ACP_LLM_PROVIDER: groq   # the scheduled eval uses the Groq secret; the app default is Amazon Bedrock
    steps:
      - name: Check secret
        id: key
        run: |
          if [ -z "$GROQ_API_KEY" ]; then echo "GROQ_API_KEY secret is not set; skipping eval."; echo "have=false" >> "$GITHUB_OUTPUT"; else echo "have=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.have == 'true'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.have == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install and build index
        if: steps.key.outputs.have == 'true'
        run: |
          pip install -r requirements.txt
          python build_index.py
      - name: Run eval
        if: steps.key.outputs.have == 'true'
        run: python -m acp.evals --pause 2
      - name: Regression gate
        if: steps.key.outputs.have == 'true'
        run: python scripts/check_regression.py
      - name: Export dashboard data
        if: steps.key.outputs.have == 'true'
        run: python scripts/export_traces.py
      - name: Commit results
        if: steps.key.outputs.have == 'true' && always()
        run: |
          git config user.name "acp-bot"
          git config user.email "acp-bot@users.noreply.github.com"
          git add results/eval_report.json results/history.jsonl dashboard/data
          git diff --cached --quiet || (git commit -m "chore: scheduled eval $(date -u +%F)" && git push)
