# Static dashboard on Kubernetes. Build the image first (for minikube: `eval $(minikube docker-env)`):
#   docker build -f Dockerfile.dashboard -t acp-dashboard:0.1 .
#   kubectl apply -f k8s/dashboard.yaml && kubectl port-forward svc/acp-dashboard 8080:80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acp-dashboard
  labels: {app: acp-dashboard}
spec:
  replicas: 2
  selector:
    matchLabels: {app: acp-dashboard}
  template:
    metadata:
      labels: {app: acp-dashboard}
    spec:
      containers:
        - name: nginx
          image: acp-dashboard:0.1
          imagePullPolicy: IfNotPresent   # image is built locally, not pulled from a registry
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: acp-dashboard
spec:
  selector: {app: acp-dashboard}
  ports:
    - port: 80
      targetPort: 80
