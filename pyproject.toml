[project]
name = "agent-control-plane"
version = "0.1.0"
description = "Tracing and grounding evals for an LLM agent"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Groq API (needs GROQ_API_KEY and RUN_LIVE=1); skipped by default"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
