[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-plane"
version = "0.1.0"
description = "Guardrails, approvals and an audit trail for AI agents that touch money"
requires-python = ">=3.11"

[project.optional-dependencies]
# What `acp.guard` needs. The rest of the repository (evals, server, worker) has its own requirements files.
guard = ["PyYAML>=6", "pydantic>=2"]

[tool.setuptools.packages.find]
include = ["acp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real AWS services (needs credentials and RUN_LIVE=1); skipped by default"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts these calls in argument defaults on purpose.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Header"]
