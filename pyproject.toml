[project]
name = "agent-control-plane"
version = "0.1.0"
description = "Tracing and grounding evals for an LLM agent"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real AWS services (needs credentials and RUN_LIVE=1); skipped by default"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts these calls in argument defaults on purpose.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Header"]
